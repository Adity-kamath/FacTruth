<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>facTruth — Real-time claim verifier</title>

<style>
  :root {
    --ink: #1b2430;
    --ink-soft: #4a5568;
    --paper: #f7f7f5;
    --card: #ffffff;
    --line: #e2e5e9;

    --accent: #466e33;
    --accent-dark: #395a29;
    --accent-soft: #e8ede4;

    --true: #466e33;
    --false: #b3441e;
    --misleading: #b8860b;
    --unverified: #5b6470;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    height: 100%;
  }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;

    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: var(--paper);
    color: var(--ink);
  }

  main {
    flex: 1 0 auto;
    padding: 32px 20px;
  }

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 32px 56px;

    background: var(--card);
    border-radius: 20px;

    box-shadow:
      0 1px 2px rgba(27, 36, 48, 0.04),
      0 24px 48px rgba(27, 36, 48, 0.10),
      0 8px 20px rgba(27, 36, 48, 0.06);
  }

  header {
    margin-bottom: 28px;
  }

  header .mark {
    display: block;
    margin-bottom: 18px;
  }

  header .mark img {
    height: 42px;
    width: auto;
    display: block;
    border-radius: 6px;

    filter: drop-shadow(
      0 4px 10px rgba(70, 110, 51, 0.28)
    );
  }

  h1 {
    font-size: 26px;
    margin: 14px 0 6px;
    letter-spacing: -0.01em;
  }

  .tagline {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }

  textarea {
    width: 100%;
    min-height: 110px;
    margin-top: 20px;

    padding: 14px;

    font-size: 15px;
    font-family: inherit;

    border: 1px solid var(--line);
    border-radius: 10px;

    resize: vertical;
    background: var(--card);

    box-shadow:
      0 1px 2px rgba(27, 36, 48, 0.04),
      0 6px 16px rgba(27, 36, 48, 0.05);
  }

  textarea:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  button {
    margin-top: 12px;

    padding: 11px 20px;

    font-size: 14px;
    font-weight: 600;

    background: var(--accent);
    color: white;

    border: none;
    border-radius: 8px;

    cursor: pointer;

    box-shadow:
      0 2px 6px rgba(70, 110, 51, 0.3),
      0 6px 16px rgba(70, 110, 51, 0.18);
  }

  button:hover {
    background: var(--accent-dark);
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none;
  }

  .result {
    margin-top: 28px;
    display: none;
  }

  .verdict-card {
    background: var(--card);

    border: 1px solid var(--line);
    border-radius: 12px;

    padding: 20px;
    margin-bottom: 14px;

    box-shadow:
      0 1px 3px rgba(27, 36, 48, 0.05),
      0 10px 26px rgba(27, 36, 48, 0.06);
  }

  .verdict-badge {
    display: inline-block;

    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.02em;

    padding: 4px 10px;
    border-radius: 6px;

    margin-bottom: 12px;

    text-transform: uppercase;
  }

  .verdict-badge.true {
    background: var(--accent-soft);
    color: var(--true);
  }

  .verdict-badge.false {
    background: #f7e6de;
    color: var(--false);
  }

  .verdict-badge.misleading,
  .verdict-badge.disputed {
    background: #f6ecd2;
    color: var(--misleading);
  }

  .verdict-badge.unverified {
    background: #eceef0;
    color: var(--unverified);
  }

  .confidence {
    font-size: 13px;
    color: var(--ink-soft);
    margin-bottom: 14px;
  }

  .summary {
    font-size: 15px;
    line-height: 1.55;
  }

  .section-label {
    font-size: 12px;

    text-transform: uppercase;
    letter-spacing: 0.05em;

    color: var(--ink-soft);
    font-weight: 700;

    margin: 18px 0 8px;
  }

  .contradiction {
    background: #fdf3ec;

    border-left: 3px solid var(--misleading);

    padding: 10px 12px;

    font-size: 14px;

    border-radius: 0 6px 6px 0;

    margin-bottom: 8px;
  }

  .source {
    display: flex;

    justify-content: space-between;

    gap: 10px;

    padding: 9px 0;

    border-bottom: 1px solid var(--line);

    font-size: 14px;
  }

  .source:last-child {
    border-bottom: none;
  }

  .source a {
    color: var(--ink);
    text-decoration: none;
  }

  .source a:hover {
    text-decoration: underline;
  }

  .cred-tag {
    font-size: 11px;
    font-weight: 700;

    padding: 2px 6px;

    border-radius: 4px;

    white-space: nowrap;

    background: var(--accent-soft);
    color: var(--accent);
  }

  .loading {
    color: var(--ink-soft);

    font-size: 14px;

    margin-top: 18px;

    display: none;
  }

  .error {
    color: var(--false);

    font-size: 14px;

    margin-top: 14px;

    display: none;
  }

  footer.site-footer {
    flex-shrink: 0;

    margin-top: 40px;

    background: var(--accent);
    color: #ffffff;

    box-shadow:
      0 -8px 20px rgba(27, 36, 48, 0.12);
  }

  .footer-inner {
    max-width: 640px;

    margin: 0 auto;

    padding: 22px 20px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    flex-wrap: wrap;

    gap: 10px;
  }


  .footer-inner .brand {
    font-size: 13px;
    color: #ffffff;
    opacity: 0.9;
  }

  .footer-inner a.more-link {
    color: #ffffff;

    font-size: 14px;
    font-weight: 700;

    text-decoration: none;

    display: inline-flex;

    align-items: center;

    gap: 6px;

    padding: 7px 14px;

    border: 1px solid rgba(255, 255, 255, 0.55);

    border-radius: 999px;
  }

  .footer-inner a.more-link:hover {
    background: rgba(255, 255, 255, 0.12);
  }
</style>
</head>

      <!-- VERDICT -->

      <div class="verdict-card">

        <div
          id="verdictBadge"
          class="verdict-badge"
        >
          —
        </div>

        <div
          class="confidence"
          id="confidenceText"
        ></div>

        <div
          class="summary"
          id="summaryText"
        ></div>

      </div>


      <!-- CONTRADICTIONS -->

      <div
        id="contradictionsWrap"
        style="display:none;"
      >

        <div class="section-label">
          Contradictions found
        </div>

        <div
          id="contradictionsList"
        ></div>

      </div>


      <!-- SOURCES -->

      <div
        id="sourcesWrap"
        style="display:none;"
      >

        <div class="verdict-card">

          <div
            class="section-label"
            style="margin-top:0;"
          >
            Sources
          </div>

          <div
            id="sourcesList"
          ></div>

        </div>

      </div>

    </div>

  </div>

</main>


<footer class="site-footer">

  <div class="footer-inner">

    <span class="brand">
      facTruth
    </span>

    
  </div>

</footer>


<script>

async function checkClaim() {

  const input =
    document.getElementById('claimInput').value.trim();

  const errorBox =
    document.getElementById('errorBox');

  const loading =
    document.getElementById('loading');

  const result =
    document.getElementById('result');

  const btn =
    document.getElementById('checkBtn');


  // Reset previous state

  errorBox.style.display = 'none';

  result.style.display = 'none';


  // Check empty input

  if (!input) {

    errorBox.textContent =
      'Paste a claim first.';

    errorBox.style.display =
      'block';

    return;
  }


  // Show loading

  loading.style.display =
    'block';

  btn.disabled =
    true;


  try {

    // Send request to Flask backend

    const res = await fetch(
      '/api/verify',
      {
        method: 'POST',

        headers: {
          'Content-Type':
            'application/json'
        },

        body: JSON.stringify({
          text: input
        })
      }
    );


    // Convert response to JSON

    const data =
      await res.json();


    console.log(
      'API RESPONSE:',
      data
    );


    // Handle backend error

    if (data.error) {

      errorBox.textContent =
        data.error;

      errorBox.style.display =
        'block';

      return;
    }


    // =========================
    // VERDICT
    // =========================

    const badge =
      document.getElementById(
        'verdictBadge'
      );


    const verdict =
      data.verdict || 'Unverified';


    badge.textContent =
      verdict;


    badge.className =
      'verdict-badge ' +
      verdict.toLowerCase();


    // =========================
    // CONFIDENCE
    // =========================

    document.getElementById(
      'confidenceText'
    ).textContent =
      `${data.confidence ?? 0}% confidence · ` +
      `${data.num_sources_checked ?? 0} sources checked`;


    // =========================
    // SUMMARY
    // =========================

    document.getElementById(
      'summaryText'
    ).textContent =
      data.summary || '';


    // =========================
    // CONTRADICTIONS
    // =========================

    const contWrap =
      document.getElementById(
        'contradictionsWrap'
      );


    const contList =
      document.getElementById(
        'contradictionsList'
      );


    contList.innerHTML =
      '';


    if (
      data.contradictions &&
      data.contradictions.length
    ) {

      data.contradictions.forEach(
        c => {

          const div =
            document.createElement(
              'div'
            );


          div.className =
            'contradiction';


          div.textContent =
            c;


          contList.appendChild(
            div
          );

        }
      );


      contWrap.style.display =
        'block';

    } else {

      contWrap.style.display =
        'none';

    }


    // =========================
    // SOURCES
    // =========================

    const srcWrap =
      document.getElementById(
        'sourcesWrap'
      );


    const srcList =
      document.getElementById(
        'sourcesList'
      );


    srcList.innerHTML =
      '';


    /*
      IMPORTANT:

      We check whether sources_used
      exists before calling forEach().
    */

    if (
      data.sources_used &&
      data.sources_used.length
    ) {

      data.sources_used.forEach(
        s => {

          console.log(
            'SOURCE RECEIVED:',
            s
          );


          const row =
            document.createElement(
              'div'
            );


          row.className =
            'source';


          /*
            IMPORTANT:

            Your backend should return:

            credibility_score

            Example:

            {
              "credibility_score": 0.95
            }

            Therefore we use credibility_score
            instead of credibility.
          */

          const pct =
            Math.round(
              (s.credibility_score || 0) * 100
            );


          row.innerHTML =
            `<a href="${s.link}" target="_blank" rel="noopener noreferrer">
              ${s.title}
            </a>
            <span class="cred-tag">
              ${pct}%
            </span>`;


          srcList.appendChild(
            row
          );

        }
      );


      srcWrap.style.display =
        'block';

    } else {

      srcWrap.style.display =
        'none';

    }


    // =========================
    // SHOW RESULT
    // =========================

    result.style.display =
      'block';


  } catch (e) {

    console.error(
      'VERIFY ERROR:',
      e
    );


    errorBox.textContent =
      'Something went wrong reaching the server.';


    errorBox.style.display =
      'block';


  } finally {

    loading.style.display =
      'none';


    btn.disabled =
      false;

  }

}

</script>

</body>
</html>
